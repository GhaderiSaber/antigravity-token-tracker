name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (PyGObject & AppIndicator)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-appindicator3-0.1 libayatana-appindicator3-1 || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rich pytest pytest-cov
          pip install PyGObject || true
          pip install -e .

      - name: Run Test Suite
        run: |
          pytest -v

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Build Dashboard Assets
        run: |
          npm --prefix frontend run build
